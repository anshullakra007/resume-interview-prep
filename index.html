<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Resume Prep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-top" style="display: flex; justify-content: center; align-items: center; gap: 1rem;">
                <h1>Welcome back to your prep journey!</h1>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark/Light Mode"></button>
            </div>
            <p>Master your engineering fundamentals, one question at a time.</p>
            
            <div class="progress-container">
                <div class="progress-text" style="align-items: center;">
                    <span><span id="progress-count">0 / 0</span> Questions Conquered</span>
                    <button id="reset-progress" class="reset-btn" aria-label="Reset Progress" title="Reset all progress">Reset</button>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
            </div>
        </header>

        <main>
            <div class="tabs-container" id="tabs-container">
                <!-- Tabs will be dynamically injected here -->
            </div>

            <div id="content-container">
                <!-- Content will be dynamically injected here -->
            </div>
        </main>
    </div>

    <!-- Import data -->
    <script src="data.js"></script>
    <!-- Import app logic -->
    <script src="script.js"></script>
</body>
</html>
